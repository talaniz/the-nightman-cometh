name: Game browser verification
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record an additional ordinary full walkthrough with game audio'
        type: boolean
        default: false
      candidate_run:
        description: 'Completed CI run containing the same ordinary build used for the three accepted runs'
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:loader
      - run: node --test tests/browser/gamepad.test.cjs
      - run: python -m pytest tests/unit tests/audio -q
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
      - run: python tools/build_web.py --output build/web --test-fixtures
      - name: Actual browser workflows
        env:
          NIGHTMAN_EVIDENCE: build/review-captures
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          npx playwright test --project=chromium --grep CONTROLLER
          npx playwright test --project=chromium --grep-invert 'ACT1_NORMAL|CONTROLLER'
          python tools/build_web.py --output build/normal
          export NIGHTMAN_BUILD=build/normal
          npx playwright test --project=chromium --grep ACT1_NORMAL
          npx playwright test --project=firefox --grep 'SMOKE|ACT1_NORMAL'
      - name: Install isolated recording tools
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio xvfb
      - name: Fetch the frozen candidate used for physical acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || { echo 'A completed candidate run ID is required'; exit 1; }
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name ordinary-game-candidate --dir build/recording-candidate
          python -c "import json; from pathlib import Path; load=lambda p: json.loads(Path(p).read_text()); assert load('build/normal/build-manifest.json')['source_fingerprint']==load('build/recording-candidate/build-manifest.json')['source_fingerprint'], 'Candidate source differs from reviewed source'"
      - name: Record additional full walkthrough with audio
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record }}
        env:
          NIGHTMAN_BUILD: build/recording-candidate
          NIGHTMAN_EVIDENCE: build/recording-captures
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          xvfb-run -a -s '-screen 0 1280x800x24' bash tools/record_walkthrough.sh
      - name: Retain recording for inspection and durable PR publication
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.record }}
        with:
          name: full-walkthrough-with-audio
          path: |
            build/walkthrough/
            build/recording-captures/
          if-no-files-found: error
      - name: Retain the exact ordinary candidate for physical testing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-game-candidate
          path: build/normal/
          if-no-files-found: warn
      - name: Stage branch screenshots for inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-review-captures
          path: build/review-captures/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
