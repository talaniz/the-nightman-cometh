[project]
name = "nightman-cometh"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["pygame-ce==2.5.8"]

[project.optional-dependencies]
dev = ["pygbag==0.9.3", "numpy==1.26.4", "pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["game*", "tools*"]
